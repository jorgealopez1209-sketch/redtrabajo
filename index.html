<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedTrabajo.bo — Connecting talent with opportunities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14295a;--navy-2:#0e1f47;--blue:#3b7cc4;--red:#d92128;
  --bg:#ffffff;--surface:#ffffff;--panel:#eef3fa;--ink:#14295a;--ink-2:#44577f;--sec:#2f6db5;
  --line:#c9d6ea;--soft:#dde7f5;--pill:#14295a;--shadow:0 10px 30px rgba(20,41,90,.12);--tb:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1530;--surface:#12204a;--panel:#0f1b3f;--ink:#f2f6ff;--ink-2:#aebbd9;--sec:#7db3f0;
    --line:#26396d;--soft:#1b2c5b;--pill:#1d3a7a;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg:#0b1530;--surface:#12204a;--panel:#0f1b3f;--ink:#f2f6ff;--ink-2:#aebbd9;--sec:#7db3f0;--line:#26396d;--soft:#1b2c5b;--pill:#1d3a7a;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
body{font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy-2);z-index:70}
body.in-app{padding-bottom:calc(var(--tb) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}

/* bilingual: English first, Spanish below */
.p{display:block;font-weight:700}
.s{display:block;font-style:italic;font-weight:500;color:var(--sec);font-size:.86em}
.dark .s,.pill .s,.btn .s{color:inherit;opacity:.9}
.lab{font-weight:700;font-size:13px;display:block;margin-bottom:5px}
.lab i{font-weight:500;color:var(--sec)}
.note{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* header / tabbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--navy-2);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;color:#fff;text-decoration:none}
.brand svg{width:34px;height:30px}
.brand b{color:#8db9ee;font-weight:900}
.chip{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;min-width:0}
.chip span.nm{max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .role{background:var(--red);border-radius:999px;padding:3px 9px;font-size:10.5px}
.chip button{color:#fff;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;min-height:36px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--navy-2);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;width:100%;max-width:600px}
.tab{flex:1;height:var(--tb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#b9c8e6;font-size:11px;font-weight:700;position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--red);border-radius:0 0 4px 4px}
.tab .badge-n{position:absolute;top:8px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

/* pills */
.pill{display:inline-block;background:var(--pill);color:#fff;padding:13px 24px 13px 20px;border-radius:6px 22px 22px 22px}
.pill .p{font-size:clamp(19px,4.6vw,28px);font-weight:800;line-height:1.1}
.pill .s{font-size:clamp(13px,3.2vw,17px);margin-top:3px}
.pill.small{padding:9px 18px 9px 16px}
.pill.small .p{font-size:clamp(15px,3.6vw,19px)}
.pill.small .s{font-size:12.5px}
.pill.center{display:block;text-align:center;border-radius:22px;max-width:520px;margin-inline:auto}
.rule{height:2px;background:var(--blue);opacity:.8;border:0}
.pad{padding:26px 0}
.sec-pad{padding:38px 0}
.panel{background:var(--panel)}

/* buttons / fields */
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:14px;font-weight:800;font-size:15px;background:var(--red);color:#fff;text-align:center;line-height:1.15;gap:1px}
.btn .p{font-weight:800}
.btn .s{font-size:11px}
.btn:hover{filter:brightness(1.08)}
.btn.blue{background:var(--blue)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--blue);color:var(--ink)}
.btn.sm{min-height:40px;padding:7px 14px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.field{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:600;font-size:15px;min-height:48px}
.field:focus{border-color:var(--blue);outline:none}
select.field{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%233b7cc4' stroke-width='2.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
textarea.field{min-height:80px;resize:vertical}
.form{display:grid;gap:14px}
.two-f{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.two-f{grid-template-columns:1fr 1fr}}

/* gate */
.hero{text-align:center;padding:30px 0 0}
.logo-big svg{width:min(76vw,360px);height:auto;color:var(--ink)}
.domain{letter-spacing:.42em;font-weight:700;font-size:clamp(12px,3.4vw,16px);margin-top:4px;padding-left:.42em}
.tag .p{font-size:clamp(21px,5.6vw,34px);font-weight:800;line-height:1.15}
.tag .s{font-size:clamp(14px,3.6vw,19px);margin-top:4px}
.roles{display:grid;gap:12px;grid-template-columns:1fr;margin:26px auto 0;max-width:720px;text-align:left}
@media(min-width:700px){.roles{grid-template-columns:repeat(3,1fr)}}
.role-card{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);width:100%;text-align:left}
.role-card:hover{filter:brightness(1.12)}
.role-card.admin{background:var(--navy-2)}
.role-card .ri{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.role-card svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role-card .p{font-size:16px;font-weight:800}
.role-card .s{font-size:12px;color:#fff;opacity:.9}
.or{display:flex;align-items:center;gap:12px;max-width:720px;margin:18px auto 0;color:var(--ink-2);font-weight:700;font-size:12px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.g-btn{display:flex;align-items:center;justify-content:center;gap:12px;max-width:420px;width:100%;margin:14px auto 0;background:#fff;color:#1f1f1f;border:2px solid #dadce0;border-radius:14px;min-height:52px;font-weight:700;font-size:15px;padding:8px 16px}
.g-btn svg{width:22px;height:22px;flex:none}
.g-btn .s{color:#5f6368;font-size:11.5px}
.g-btn:hover{background:#f6f8fb}
.linkish{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:8px}
.toggle{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 0;background:var(--soft);color:var(--ink);border-radius:999px;padding:10px 22px;font-weight:800;text-align:center}
.toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.toggle .s{font-size:11px}
.stripe{height:44px;margin-top:30px;background:linear-gradient(115deg,transparent 0 62%,var(--blue) 62% 66%,transparent 66% 70%,var(--navy) 70% 100%),linear-gradient(245deg,transparent 0 62%,var(--navy) 62% 100%)}

/* info */
.two{display:grid;gap:30px;grid-template-columns:1fr}
@media(min-width:800px){.two{grid-template-columns:1fr 1fr;gap:40px}}
.big{display:flex;align-items:center;gap:16px;margin:18px 0 8px}
.big .num{font-size:clamp(60px,15vw,100px);font-weight:900;line-height:.9;letter-spacing:-2px}
.big svg{width:72px;height:72px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.big-t .p{font-size:clamp(16px,3.8vw,20px)}
.copy{font-size:15px;margin-top:14px}
.copy .p{font-weight:600}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;text-align:center}
.why div{display:flex;flex-direction:column;align-items:center;gap:6px}
.why .p{font-size:12px}.why .s{font-size:11px}
.ico{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{display:grid;margin-top:14px}
.step{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:2px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.step .ic{width:42px;height:42px;flex:none;color:var(--ink)}
.step .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.step .p{font-weight:600;font-size:14.5px}
.rev{display:flex;gap:18px;align-items:center;margin-top:16px}
.rev .pct{font-size:clamp(52px,13vw,84px);font-weight:900;line-height:.9;padding-right:18px;border-right:2px solid var(--line)}
.rev-t .p{font-size:clamp(16px,4vw,21px)}
.calc{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:14px}
.calc .row,.sum .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-weight:700}
.calc .row+.row,.sum .row+.row{border-top:1px solid var(--line)}
.row.hl{color:var(--red)}
.checks{list-style:none;display:grid;gap:12px;margin-top:16px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks svg{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.checks .p{font-weight:600;font-size:14.5px}
.founders{text-align:center;padding:26px 0 8px}
.founders .lbl{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:6px 18px;font-weight:800;font-size:14px}
.founders .names{margin-top:12px;font-weight:800;font-size:15px;line-height:1.8}
.founders .names span{display:inline-block;margin:0 8px;white-space:nowrap}

/* categories / cards */
.search{background:var(--navy);color:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.search{grid-template-columns:1.2fr 1fr;padding:18px}}
.search .lab{color:#fff}.search .lab i{color:#fff;opacity:.85}
.search .field{background:#fff;color:#14295a}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
@media(min-width:700px){.cats{grid-template-columns:repeat(5,1fr)}}
.cat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
.cat:hover{border-color:var(--blue)}
.cat[aria-pressed="true"]{border-color:var(--red);background:var(--soft)}
.cat[aria-pressed="true"] .ico{background:var(--navy);color:#fff}
.cat .p{font-size:12px;line-height:1.1}.cat .s{font-size:10.5px;line-height:1.1}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 14px}
.sort{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.sort select{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 30px 8px 10px;min-height:40px;font-weight:600;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%233b7cc4' stroke-width='2.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;gap:12px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:none}
.card h3{font-size:16px;font-weight:800;line-height:1.15}
.meta{font-size:12.5px;color:var(--ink-2);font-weight:600}
.rate{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;flex-wrap:wrap}
.star{width:15px;height:15px;fill:var(--red)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft)}
.badge svg{width:13px;height:13px;stroke:var(--blue);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.badge.new{background:transparent;border:1.5px dashed var(--blue)}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;flex-wrap:wrap}
.price{font-weight:900;font-size:19px;line-height:1}
.price small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:30px 16px;text-align:center;background:var(--panel);border-radius:20px;border:2px dashed var(--line);grid-column:1/-1}

/* messages */
.thread-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;margin-top:10px}
.thread-item .tx{min-width:0;flex:1}
.thread-item b{font-size:14.5px;display:block}
.thread-item span.last{font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.thread-top{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);margin-bottom:12px}
.back{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.bubbles{display:flex;flex-direction:column;gap:8px;min-height:40vh;padding-bottom:10px}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14.5px;font-weight:600;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:var(--soft);border-bottom-left-radius:5px}
.bub time{display:block;font-size:10.5px;opacity:.7;font-weight:600;margin-top:2px}
.composer{position:sticky;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0;display:flex;gap:8px}
.composer .field{flex:1}
.composer .btn{min-width:84px}

/* jobs / admin */
.job{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;display:grid;gap:10px}
.job-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job b{font-size:15px}
.status{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--soft);white-space:nowrap}
.status.pending{background:#ffe9c9;color:#6b4300}
.status.accepted{background:#d8e9ff;color:#0e3a75}
.status.completed{background:#e3d8ff;color:#3b1a85}
.status.paid{background:#d6f3df;color:#0f5a2a}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--navy);color:#fff;border-radius:18px;padding:14px}
.stat .v{font-size:26px;font-weight:900;line-height:1}
.stat .p{font-size:12px;margin-top:6px}.stat .s{font-size:11px;color:#fff;opacity:.85}
.stat.red{background:var(--red)}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;margin-top:12px}
.ok{background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:700;font-size:13.5px}
.err{color:var(--red);font-weight:700;font-size:13px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,15,38,.66);display:none;align-items:flex-end;justify-content:center;z-index:100;padding-top:env(safe-area-inset-top,0px)}
.modal.open{display:flex}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
@media(min-width:700px){.sheet{border-radius:26px}}
.close{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--ink);font-size:22px;font-weight:700;z-index:2}
.sheet h2{font-size:21px;font-weight:800;line-height:1.1;padding-right:44px}
.sheet h4{font-size:14px;font-weight:800;margin:16px 0 4px}
.port{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.port div{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;text-align:center;padding:6px}
.rev-item{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px}
.sum{background:var(--panel);border-radius:16px;padding:10px 14px}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:800;font-size:13px;color:var(--ink-2);line-height:1.15}
.seg button .s{font-size:10.5px}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.seg button[aria-selected="true"] .s{color:#fff}
.done{text-align:center;padding:10px 0 0}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--navy);display:grid;place-items:center;margin:0 auto 12px}
.done .tick svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:12px;background:var(--panel);display:grid;place-items:center}
.stars button svg{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:2}
.stars button[aria-pressed="true"] svg{fill:var(--red)}
footer{background:var(--navy-2);color:#fff;text-align:center;padding:22px 0 30px;margin-top:30px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ---------- app shell ---------- */
function tabsFor(role){
 if(role==="customer")return [["find","Find","Buscar","search"],["msgs","Messages","Mensajes","chat"],["jobs","My jobs","Mis trabajos","list"],["info","More info","Más info","info"]];
 if(role==="worker")return [["dash","Dashboard","Panel","home"],["msgs","Messages","Mensajes","chat"],["info","More info","Más info","info"]];
 return [["admin","Admin","Admin","shield"],["info","More info","Más info","info"]];
}
function unreadCount(){
 var u=me();if(!u)return 0;
 var n=0;DB.msgs.forEach(function(m){
  if(m.read)return;
  if(u.role==="customer"&&m.cid===u.id&&m.from==="w")n++;
  if(u.role==="worker"){var w=myWorker();if(w&&m.wid===w.id&&m.from==="c")n++}
 });return n;
}
function render(){
 var u=me();
 document.body.classList.toggle("in-app",!!u);
 if(!u){$("app").innerHTML=gateHTML();window.scrollTo(0,0);return}
 if(!ui.tab)ui.tab=tabsFor(u.role)[0][0];
 var tabs=tabsFor(u.role);
 var cur=ui.tab==="thread"?"msgs":ui.tab;
 var un=unreadCount();
 var tb=tabs.map(function(t){
  return '<button class="tab" data-act="tab" data-tab="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+ico(t[3])+'<span>'+t[1]+'</span>'+(t[0]==="msgs"&&un?'<span class="badge-n">'+un+'</span>':'')+'</button>';
 }).join("");
 $("app").innerHTML=
  '<header class="top"><div class="wrap"><a class="brand" href="#" data-act="home" aria-label="RedTrabajo.bo">'+MINI+'<span>RED<b>TRABAJO</b></span></a>'+
  '<div class="chip"><span class="role">'+roleLabel(u.role)+'</span><span class="nm">'+esc(u.name)+'</span><button data-act="logout">Log out</button></div></div></header>'+
  '<main class="wrap pad" id="view"></main>'+
  '<nav class="tabbar" aria-label="Main"><div class="in">'+tb+'</div></nav>';
 renderView();
}
function renderView(){
 var v=$("view");if(!v)return;
 var t=ui.tab;
 if(t==="find")v.innerHTML=findHTML();
 else if(t==="msgs")v.innerHTML=msgsHTML();
 else if(t==="thread")v.innerHTML=threadHTML();
 else if(t==="jobs")v.innerHTML=jobsHTML();
 else if(t==="dash")v.innerHTML=dashHTML();
 else if(t==="admin")v.innerHTML=adminHTML();
 else if(t==="info")v.innerHTML='<div class="pill"><span class="p">More info</span><span class="s">Más información</span></div>'+infoHTML();
 if(t==="find"){renderCats();renderResults()}
 if(t==="thread"){var b=$("bubbles");if(b){window.scrollTo(0,document.body.scrollHeight)}}
 else window.scrollTo(0,0);
}

function filtered(){
 var q=norm(ui.q.trim());
 var list=DB.workers.filter(function(w){
  if(ui.cat!=="all"&&w.cat!==ui.cat)return false;
  if(ui.city!=="all"&&w.city!==ui.city)return false;
  if(q){
   var c=catOf(w.cat),hay=norm([w.name,c.en,c.es,w.bio,w.city].join(" "));
   var words=q.split(/\s+/);
   for(var i=0;i<words.length;i++){
    var wd=words[i];
    if(hay.indexOf(wd)===-1&&!(wd.length>4&&hay.indexOf(wd.slice(0,wd.length-2))!==-1))return false;
   }
  }
  return true;
 });
 list.sort(function(a,b){
  if(ui.sort==="price")return a.price-b.price;
  if(ui.sort==="jobs")return b.jobs-a.jobs;
  return b.rating-a.rating||b.jobs-a.jobs;
 });
 return list;
}
function renderResults(){
 var r=$("results");if(!r)return;
 var list=filtered();
 $("count").innerHTML='<div class="p">'+list.length+(list.length===1?" worker found":" workers found")+'</div><div class="s">'+list.length+(list.length===1?" trabajador encontrado":" trabajadores encontrados")+'</div>';
 if(!list.length){r.innerHTML='<div class="empty">'+bi("No results with these filters.","No hay resultados con estos filtros.")+'<p class="note" style="margin-top:8px">Try another city or pick “All”. · Prueba otra ciudad o elige “Todos”.</p></div>';return}
 r.innerHTML=list.map(function(w){
  var c=catOf(w.cat);
  return '<article class="card"><div class="card-h"><div class="avatar" style="background:'+col(w.id)+'" aria-hidden="true">'+initials(w.name)+'</div><div><h3>'+esc(w.name)+'</h3><div class="meta">'+c.en+' · '+c.es+'<br>'+esc(w.city)+' · '+w.years+' yrs · años</div></div></div>'+

/* ---------- messages ---------- */
function threadsFor(u){
 var map={},out=[];
 DB.msgs.forEach(function(m){
  var mine=u.role==="customer"?m.cid===u.id:(function(){var w=myWorker();return w&&m.wid===w.id})();
  if(!mine)return;
  var k=m.cid+"-"+m.wid;
  if(!map[k]){map[k]={cid:m.cid,wid:m.wid,last:m,unread:0};out.push(map[k])}
  map[k].last=m;
  if(!m.read&&((u.role==="customer"&&m.from==="w")||(u.role==="worker"&&m.from==="c")))map[k].unread++;
 });
 out.sort(function(a,b){return b.last.ts-a.last.ts});
 return out;
}

 var u=me(),t=ui.thread;
 DB.msgs.push({id:DB.nextId++,cid:t.cid,wid:t.wid,from:u.role==="customer"?"c":"w",text:text,ts:Date.now(),read:false});

  var n=DB.msgs.filter(function(m){return m.cid===t.cid&&m.wid===t.wid&&m.from==="c"}).length;
  setTimeout(function(){

 }
 render();

}

  (mode==="signup"?'<div><label class="lab" for="aName">Full name <i>Nombre completo</i></label><input class="field" id="aName" autocomplete="name"></div>':'')+
  '<div><label class="lab" for="aEmail">Email <i>Correo</i></label><input class="field" id="aEmail" type="email" autocomplete="email" inputmode="email"></div>'+
  '<div><label class="lab" for="aPass">Password <i>Contraseña</i></label><input class="field" id="aPass" type="password" autocomplete="'+(mode==="signup"?"new-password":"current-password")+'"></div>'+
  (mode==="signup"&&role==="worker"?workerFields():'')+
  '<button class="btn full" type="submit"><span class="p">'+(mode==="signup"?"Create account":"Log in")+'</span><span class="s">'+(mode==="signup"?"Crear cuenta":"Iniciar sesión")+'</span></button><p class="err" id="aMsg" role="status"></p></form>';
 }
 openModal(h);
}
function openLogin(){openAuth("customer","login")}
function openGoogle(){
 openModal('<h2 id="mTitle">Continue with Google</h2><p class="note">Continuar con Google</p>'+
 '<form class="form" id="googleForm" style="margin-top:14px" novalidate>'+
  '<div><label class="lab" for="gEmail">Gmail address <i>Correo de Gmail</i></label><input class="field" id="gEmail" type="email" inputmode="email" placeholder="name@gmail.com"></div>'+
  '<div><label class="lab" for="gRole">I am a <i>Soy</i></label><select class="field" id="gRole"><option value="customer">Customer · Cliente</option><option value="worker">Worker · Trabajador</option></select></div>'+
  '<div id="gWorker" hidden>'+workerFields()+'</div>'+
  '<button class="btn full" type="submit" style="background:#fff;color:#1f1f1f;border:2px solid #dadce0"><span class="p" style="display:flex;gap:10px;align-items:center;justify-content:center"><span style="width:20px;height:20px;display:inline-block">'+GOOGLE+'</span>Continue · Continuar</span></button><p class="err" id="gMsg" role="status"></p>'+
  '<p class="hint">Demo: this simulates Google sign-in. Real Google login needs a server and a Google OAuth setup. · Demo: esto simula el acceso con Google. El acceso real requiere un servidor y configurar Google OAuth.</p></form>');
}
function makeWorkerFor(user,data){
 var w={id:DB.nextId++,ownerId:user.id,name:user.name,cat:data.cat,city:data.city,price:data.price,rating:5.0,jobs:0,years:0,verified:false,bio:data.bio||"New on RedTrabajo. / Nuevo en RedTrabajo.",rev:[],port:["Work 1","Work 2","Work 3"],phone:data.phone};
 DB.workers.unshift(w);return w;
}
function readWorker(){
 var price=parseFloat($("aPrice").value);
 return {cat:$("aCat").value,city:$("aCity").value,price:price,phone:$("aPhone").value.trim(),bio:$("aBio").value.trim()};
}
function login(u){DB.session=u.id;ui.tab=null;ui.thread=null;save();closeModal();render()}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act]");if(!el)return;
 var a=el.getAttribute("data-act"),d=function(k){return el.getAttribute("data-"+k)};
 if(a==="home"||a==="close"){e.preventDefault();if(a==="close")closeModal();else{var u=me();ui.tab=u?tabsFor(u.role)[0][0]:null;render()}return}
 if(a==="role"){openAuth(d("role"),"signup");return}
 if(a==="login"){openLogin();return}
 if(a==="google"){openGoogle();return}
 if(a==="authmode"){openAuth(d("role"),d("mode"));return}
 if(a==="info"){var b=$("infoBox"),open=b.hidden;b.hidden=!open;el.setAttribute("aria-expanded",String(open));if(open)setTimeout(function(){b.scrollIntoView({behavior:"smooth",block:"start"})},30);return}
 if(a==="logout"){DB.session=null;ui.tab=null;ui.thread=null;save();render();return}
 if(a==="tab"){if($("modal").classList.contains("open"))closeModal();ui.tab=d("tab");render();return}
 if(a==="cat"){ui.cat=d("cat");renderCats();renderResults();return}
 if(a==="open"){openProfile(+d("wid"));return}
 if(a==="message"){
  var u2=me();
  if(!u2||u2.role!=="customer"){closeModal();return}
  startThread(+d("wid"));return;
 }
 if(a==="hire"){var u3=me();if(!u3||u3.role!=="customer"){return}openBooking(+d("wid"));return}
 if(a==="thread"){ui.thread={cid:+d("cid"),wid:+d("wid")};ui.tab="thread";render();return}
 if(a==="threadc"){ui.thread={cid:+d("cid"),wid:+d("wid")};ui.tab="thread";render();return}
 if(a==="jobset"){
  var j=DB.jobs.filter(function(x){return x.id===+d("jid")})[0];
  if(j){j.status=d("to");save();render()}return;
 }
 if(a==="pay"){openPay(+d("jid"));return}
 if(a==="star"){
  var n=+d("n"),box=$("stars");box.setAttribute("data-v",n);
  Array.prototype.forEach.call(box.children,function(btn,i){btn.setAttribute("aria-pressed",String(i<n))});return;
 }
 if(a==="verify"){var w=worker(+d("wid"));if(w){w.verified=!w.verified;save();render()}return}
 if(a==="remove"){DB.workers=DB.workers.filter(function(x){return x.id!==+d("wid")});save();render();return}
 if(a==="reset"){var s=DB.session;DB=seed();DB.session=null;save();ui.tab=null;render();return}
});

document.addEventListener("input",function(e){
 if(e.target.id==="q"){ui.q=e.target.value;renderResults()}
});
document.addEventListener("change",function(e){
 if(e.target.id==="city"){ui.city=e.target.value;renderResults()}
 if(e.target.id==="sort"){ui.sort=e.target.value;renderResults()}
 if(e.target.id==="gRole"){$("gWorker").hidden=e.target.value!=="worker"}
});

document.addEventListener("submit",function(e){
 e.preventDefault();
 var f=e.target,id=f.id;
 if(id==="authForm"){
  var role=f.getAttribute("data-role"),mode=f.getAttribute("data-mode"),msg=$("aMsg");
  if(mode==="admin"){
   if($("aPass").value!==ADMIN_PASS){msg.textContent="Wrong password. · Contraseña incorrecta.";return}
   var ad=DB.users.filter(function(u){return u.role==="admin"})[0];
   if(!ad){ad={id:DB.nextId++,role:"admin",name:"Admin",email:"admin"};DB.users.push(ad)}
   login(ad);return;
  }
  var email=$("aEmail").value.trim().toLowerCase(),pass=$("aPass").value;
  if(mode==="login"){
   var found=DB.users.filter(function(u){return u.email===email&&u.pass===pass&&u.role!=="admin"})[0];
   if(!found){msg.textContent="Email or password is incorrect. · Correo o contraseña incorrectos.";return}
   login(found);return;
  }
  var name=$("aName").value.trim();
  if(!name||email.indexOf("@")<1||pass.length<4){msg.textContent="Enter your name, a valid email and a password of 4+ characters. · Ingresa tu nombre, un correo válido y una contraseña de 4+ caracteres.";return}
  if(DB.users.some(function(u){return u.email===email})){msg.textContent="That email is already registered. Log in instead. · Ese correo ya está registrado. Inicia sesión.";return}
  var wd=null;
  if(role==="worker"){wd=readWorker();if(!(wd.price>=10)||!wd.phone){msg.textContent="Add a starting price and phone. · Agrega precio y teléfono.";return}}
  var nu={id:DB.nextId++,role:role,name:name,email:email,pass:pass};
  DB.users.push(nu);if(wd)makeWorkerFor(nu,wd);
  login(nu);return;
 }
 if(id==="googleForm"){
  var ge=$("gEmail").value.trim().toLowerCase(),gm=$("gMsg"),gr=$("gRole").value;
  if(ge.indexOf("@")<1){gm.textContent="Enter a valid Gmail address. · Ingresa un Gmail válido.";return}
  var ex=DB.users.filter(function(u){return u.email===ge})[0];
  if(ex&&ex.role!=="admin"){login(ex);return}
  var wd2=null;
  if(gr==="worker"){wd2=readWorker();if(!(wd2.price>=10)){gm.textContent="Add a starting price. · Agrega un precio desde.";return}}
  var nm=ge.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()});
  var gu={id:DB.nextId++,role:gr,name:nm,email:ge,pass:null,google:true};
  DB.users.push(gu);if(wd2)makeWorkerFor(gu,wd2);
  login(gu);return;
 }
 if(id==="msgForm"){
  var t=$("msgIn").value.trim();if(!t)return;sendMsg(t);return;
 }
 if(id==="bookForm"){
  var wid=+f.getAttribute("data-wid"),desc=$("bDesc").value.trim(),p=parseFloat($("bPrice").value),bm=$("bMsg");
  if(!desc){bm.textContent="Describe the job. · Describe el trabajo.";return}
  if(!(p>=10)){bm.textContent="Enter a valid price. · Ingresa un precio válido.";return}
  var u=me(),w=worker(wid);
  DB.jobs.push({id:DB.nextId++,cid:u.id,wid:wid,desc:desc,date:$("bDate").value,price:p,status:"pending"});
  if(w.ownerId==null){ // sample workers respond automatically in the demo
   var jb=DB.jobs[DB.jobs.length-1];
   setTimeout(function(){if(jb.status==="pending"){jb.status="accepted";save();if(ui.tab==="jobs")render()}},2500);
   setTimeout(function(){if(jb.status==="accepted"){jb.status="completed";save();if(ui.tab==="jobs")render()}},6000);
  }
  save();
  openModal('<div class="done"><div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><h2 id="mTitle" style="padding:0">Request sent!</h2><p class="note" style="font-size:14px;margin-top:4px">¡Solicitud enviada!</p>'+
   '<p style="margin-top:12px;font-weight:600;font-size:14.5px">'+esc(w.name)+' will confirm. After the job you can pay and leave a review.</p><p class="note" style="margin-top:4px">'+esc(w.name)+' confirmará. Después del trabajo podrás pagar y dejar tu reseña.</p>'+
   '<div class="btns" style="margin-top:18px;justify-content:center"><button class="btn blue" data-act="tab" data-tab="jobs"><span class="p">My jobs</span><span class="s">Mis trabajos</span></button><button class="btn ghost" data-act="close"><span class="p">Close</span><span class="s">Cerrar</span></button></div></div>');
  return;
 }
 if(id==="payForm"){
  var jid=+f.getAttribute("data-jid"),jb2=DB.jobs.filter(function(x){return x.id===jid})[0];
  var rate=+$("stars").getAttribute("data-v"),com=$("pCom").value.trim()||"—",w2=worker(jb2.wid),cu=me();
  jb2.status="paid";
  w2.rev.unshift([cu.name,com,rate]);
  w2.rating=Math.round(((w2.rating*w2.jobs+rate)/(w2.jobs+1))*10)/10;
  w2.jobs+=1;
  save();closeModal();render();return;
 }
});

render();
})();
</script>
</body>
</html>
